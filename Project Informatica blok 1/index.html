<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cube Engineers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            Cube<span>Engineers</span>
        </div>

        <div class="header-right">
            <span>Cube solver</span>
        </div>
    </header>


    <main>

        <section class="hero">

            <div class="hero-text">

                <p class="small-text">RUBIKS CUBE SOLVER</p>

                <h1>
                    Los je RubikCube<br>
                    stap voor stap op.
                </h1>

                <p class="intro">
                    Maak fotos van je rubikscube en dan kan je zien wat je moet doen om hem op te lossen
                </p>

                <div class="buttons">

                    <button class="camera-button">
                        Camera
                    </button>

                    <button class="manual-button">
                        Zelf kleuren invullen
                    </button>

                </div>

            </div>


            <div class="cube-image">

                <img src="rubiks-cube-transparant-v5 (1).png" alt="Rubiks Cube">

            </div>

        </section>


        <section class="onderkant">

            <div>
                <span>1</span>
                <p>Maak foto's</p>
            </div>

            <div>
                <span>2</span>
                <p>Controleer je rubixcube</p>
            </div>

            <div>
                <span>3</span>
                <p>Volg de oplossing</p>
            </div>

        </section>

    </main>

</body>

</html>
