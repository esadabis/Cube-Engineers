<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cube Engineers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            Cube<span>Engineers</span>
        </div>

        <div class="header-right">
            <span>Cube solver</span>
        </div>
    </header>


    <main>

        <section class="hero">

            <div class="hero-text">

                <p class="small-text">RUBIK'S CUBE SOLVER</p>

                <h1>
                    Los je Rubik's Cube<br>
                    stap voor stap op.
                </h1>

                <p class="intro">
                    Maak fotos van je Rubik's Cube en dan kan je zien wat je moet doen om hem op te lossen
                </p>

                <div class="buttons">

                    <a href="camera.html" class="camera-button">
                        Camera
                    </a>

                    <a href="zelf-invullen.html" class="manual-button">
                        Zelf kleuren invullen
                    </a>

                </div>

            </div>


            <!-- 3D Rubik's Cube gemaakt met CSS (vervangt het oude plaatje) -->
            <div class="cube-image" role="img" aria-label="Draaiende Rubik's Cube">

                <div class="cube-float">
                    <div class="cube-scene">

                        <!-- Zwarte binnenkern: zorgt dat je niet door de hoekjes heen kijkt -->
                        <div class="cube-core front"></div>
                        <div class="cube-core back"></div>
                        <div class="cube-core right"></div>
                        <div class="cube-core left"></div>
                        <div class="cube-core top"></div>
                        <div class="cube-core bottom"></div>

                        <!-- Logo-kant: helemaal wit met schuin ons logo -->
                        <div class="cube-face front logo-face">
                            <div class="cube-logo">Cube<span>Engineers</span></div>
                        </div>

                        <div class="cube-face right">
                            <i class="b"></i><i class="r"></i><i class="r"></i>
                            <i class="w"></i><i class="r"></i><i class="y"></i>
                            <i class="r"></i><i class="o"></i><i class="g"></i>
                        </div>

                        <div class="cube-face back">
                            <i class="y"></i><i class="b"></i><i class="o"></i>
                            <i class="b"></i><i class="b"></i><i class="r"></i>
                            <i class="w"></i><i class="b"></i><i class="g"></i>
                        </div>

                        <div class="cube-face left">
                            <i class="o"></i><i class="w"></i><i class="o"></i>
                            <i class="g"></i><i class="o"></i><i class="r"></i>
                            <i class="y"></i><i class="o"></i><i class="b"></i>
                        </div>

                        <div class="cube-face top">
                            <i class="w"></i><i class="w"></i><i class="r"></i>
                            <i class="y"></i><i class="w"></i><i class="g"></i>
                            <i class="w"></i><i class="o"></i><i class="w"></i>
                        </div>

                        <div class="cube-face bottom">
                            <i class="g"></i><i class="y"></i><i class="y"></i>
                            <i class="r"></i><i class="y"></i><i class="b"></i>
                            <i class="y"></i><i class="w"></i><i class="o"></i>
                        </div>

                    </div>
                </div>

                <div class="cube-shadow"></div>

            </div>

        </section>


        <section class="onderkant">

            <div>
                <span>1</span>
                <p>Maak foto's</p>
            </div>

            <div>
                <span>2</span>
                <p>Controleer je Rubik's Cube</p>
            </div>

            <div>
                <span>3</span>
                <p>Volg de oplossing</p>
            </div>

        </section>

    </main>

</body>

</html>
